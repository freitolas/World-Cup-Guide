name: Daily update

# Pulls results, refreshes predictions, applies the star-weighted news/context
# layer, freezes THE AI's pick for IMMINENT fixtures (within FREEZE_HORIZON_HOURS
# of kickoff), rebuilds, and commits. Netlify serves the committed dist/, so the
# push deploys.
#
# Runs every 3 hours so each match freezes ~2-3h before ITS OWN kickoff (not the
# day's first) — fresh team news per match. Robust to the still-provisional
# kickoff times. The news/football APIs are only called when a fixture is near
# the freeze window (see update.mjs), so the off-peak runs are cheap. Commits
# only happen when results/predictions/picks actually change, so deploys are not
# spammed.
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update results, predictions, context, bot picks, and rebuild
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          NEWSDATA_KEY: ${{ secrets.NEWSDATA_KEY }}
          # Upset/context layer ON: star-weighted suspensions/injuries/crisis adjust
          # ratings before picks freeze. Set repo var CONTEXT_ENABLED=0 to disable.
          CONTEXT_ENABLED: ${{ vars.CONTEXT_ENABLED || '1' }}
        run: npm run update:commit
