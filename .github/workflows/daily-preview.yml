name: Daily preview

# Once a day at 12:00 BST, predict EVERY fixture kicking off in the next
# PREVIEW_WINDOW_HOURS (default 20 — "the day", allowing for kickoffs that spill
# into the next UK calendar day) WITH the news/context layer applied, and POST a
# single digest to the Telegram webhook (MAKE_FREEZE_WEBHOOK). It does NOT freeze,
# write, or commit — these are live projections that still move until each pick
# locks near kickoff (handled by data-pipeline.yml). The freeze itself sends its
# own Telegram confirmation per match.
#
# Cron is UTC; the World Cup (Jun–Jul) is entirely in BST (UTC+1), so 11:00 UTC
# = 12:00 BST. Adjust the cron if ever running outside BST.
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Predict the next 20h and send the Telegram digest (no freeze)
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          NEWSDATA_KEY: ${{ secrets.NEWSDATA_KEY }}
          CONTEXT_ENABLED: ${{ vars.CONTEXT_ENABLED || '1' }}
          MAKE_FREEZE_WEBHOOK: ${{ secrets.MAKE_FREEZE_WEBHOOK }}
          # Override the look-ahead window if needed (hours).
          PREVIEW_WINDOW_HOURS: ${{ vars.PREVIEW_WINDOW_HOURS || '20' }}
        run: node scripts/update.mjs --preview --no-build
