name: Preview picks

# Read-only preview of THE AI's picks for the next N hours, with the news/context
# layer FORCE-checked. Never freezes picks, writes data, or posts to X. Sends the
# digest to Telegram (via MAKE_FREEZE_WEBHOOK — same webhook/bot as the freeze
# confirmations). Always logs the full breakdown to the run output too.
# It DOES commit ONE file — src/data/news-signals.json, the rolling news-signal
# cache — best-effort, so its frequent samples are remembered for the lock too.
#
# Triggered DAILY at 12:00 London by a Make.com scenario ("AI preview — daily noon
# trigger") via workflow_dispatch. GitHub's own cron is unreliable (runs delayed by
# hours or skipped), so we deliberately do NOT use schedule:. Manual dispatch works too.
on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Look-ahead window in hours'
        required: false
        default: '20'
        type: string

permissions:
  contents: write   # only to commit src/data/news-signals.json (see final step)

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Preview picks (news checked, nothing frozen) + Telegram digest
        env:
          # On manual runs use the chosen window; on the daily schedule inputs is
          # empty, so the script falls back to 20h.
          PREVIEW_WINDOW_HOURS: ${{ inputs.hours }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          NEWSDATA_KEY: ${{ secrets.NEWSDATA_KEY }}
          CONTEXT_ENABLED: ${{ vars.CONTEXT_ENABLED || '1' }}
          MAKE_FREEZE_WEBHOOK: ${{ secrets.MAKE_FREEZE_WEBHOOK }}
        run: node scripts/preview-picks.mjs

      # Persist ONLY the news-signal cache. Best-effort: rebase onto the branch and
      # push the single file; never fail the job if it races the data pipeline.
      - name: Commit news-signal cache (best-effort)
        if: ${{ always() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/data/news-signals.json; then
            echo "news-signal cache unchanged — nothing to commit"; exit 0
          fi
          git add src/data/news-signals.json
          git commit -m "chore: refresh news-signal cache [skip ci]" || exit 0
          for i in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "cache pushed"; exit 0
            fi
            echo "push race, retrying…"; git rebase --abort 2>/dev/null || true; sleep $((2**i))
          done
          echo "could not push cache after retries — skipping (best-effort)"; exit 0
