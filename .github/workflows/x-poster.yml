name: Post picks to X

# THE AI posts its frozen pick shortly before kickoff (public, timestamped, no
# edits). It also runs the dare (Beat 1) and result (Beat 3) beats.
#
# RELIABILITY: GitHub's scheduled runs get delayed/SKIPPED under load (esp. at
# :00/:50). Beat 2 MUST land in the 15-min pre-kickoff window, so we poll every
# ~8 min at off-peak minutes during match hours (16:00–07:59 UTC) — multiple runs
# fall in every window, surviving a skipped run. Each run is idempotent and exits
# fast; the active-window gate limits it to the tournament. The script also writes
# src/data/x-feed.json (the on-site feed).
#
# ⚠️ DISABLE this workflow after 2026-07-19 (Actions tab → ⋯ → Disable workflow)
# to stop the off-season runs. Default-branch-only; needs X_* secrets.
on:
  schedule:
    - cron: '7,15,23,31,39,47,55 16-23,0-7 * * *'
  workflow_dispatch: # manual run (always proceeds; dry-run if no secrets)
    inputs:
      test:
        description: 'Post a one-off test tweet now to verify the X credentials'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-picks
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Active-window gate (warm-ups + tournament only)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)
          if [[ "$TODAY" > "2026-05-19" && "$TODAY" < "2026-07-20" ]]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'yes'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'yes'
        with:
          node-version: '22'

      - name: Post imminent picks
        if: steps.gate.outputs.run == 'yes'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node scripts/post-picks.mjs ${{ inputs.test && '--test' || '' }}

      - name: Persist posted-state + feed
        if: steps.gate.outputs.run == 'yes'
        run: |
          if ! git diff --quiet -- src/data/posted.json src/data/x-feed.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/posted.json src/data/x-feed.json
            git commit -m "chore: record posted picks + feed [skip ci]"
            git push
          else
            echo "no new posts to persist"
          fi
