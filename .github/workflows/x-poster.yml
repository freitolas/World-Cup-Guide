name: Post picks to X

# THE AI posts its frozen pick shortly before kickoff (public, timestamped, no
# edits). It also runs the dare (Beat 1) and result (Beat 3) beats.
#
# TRIGGER: driven by a Make.com scenario that hits the workflow_dispatch API every
# ~10–15 min, 24/7 (see MAKE_XPOSTER_TRIGGER.md). GitHub's own `schedule:` cron was
# REMOVED (2026-06): it was throttled to ~6–9 runs/day so it almost never hit the
# 15-min Beat-2 window, and it only duplicated Actions minutes on top of Make.
# Make is verified live (29/30 recent runs were dispatches). Each run is idempotent
# (posted.json), exits fast, and also writes src/data/x-feed.json (the on-site feed).
#
# ⚠️ After 2026-07-19: stop the Make scenario (it's the clock now); optionally also
# disable this workflow (Actions tab → ⋯ → Disable workflow). Needs X_* secrets.
on:
  workflow_dispatch: # Make.com trigger (and manual). Always proceeds; dry-run if no secrets.
    inputs:
      test:
        description: 'Post a one-off test tweet now to verify the X credentials'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-picks
  cancel-in-progress: false

jobs:
  post:
    if: false  # ⛔ DISABLED: World Cup 2026 over. Make may still dispatch, but runs skip instantly. Delete this line to re-enable.
    runs-on: ubuntu-latest
    steps:
      - name: Active-window gate (warm-ups + tournament only)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)
          if [[ "$TODAY" > "2026-05-19" && "$TODAY" < "2026-07-20" ]]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'yes'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'yes'
        with:
          node-version: '22'

      - name: Post imminent picks
        if: steps.gate.outputs.run == 'yes'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node scripts/post-picks.mjs ${{ inputs.test && '--test' || '' }}

      - name: Persist posted-state + feed
        if: steps.gate.outputs.run == 'yes'
        run: |
          if ! git diff --quiet -- src/data/posted.json src/data/x-feed.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/posted.json src/data/x-feed.json
            git commit -m "chore: record posted picks + feed [skip ci]"
            git push
          else
            echo "no new posts to persist"
          fi
