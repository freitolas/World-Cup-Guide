# Netlify config for the Game (humansareinferior.com).
#
# Connect a NEW, SEPARATE Netlify site to this repo with:
#   Base directory:    game
#   Build command:     npm run build
#   Publish directory:  game/dist   (i.e. "dist" relative to the base)
#
# Because the base directory is `game`, Netlify rebuilds the Game on every push
# (including the daily data pipeline's commits), so its data stays fresh. The
# Guide is a different Netlify site and is unaffected.
[build]
  command = "npm run build"
  publish = "dist"

# Canonicalise to the custom domain. Supabase's Site URL still points at the
# .netlify.app host, so magic links land there first; this 301s them (with the
# ?code= query preserved) onto humansareinferior.com so sign-in completes on the
# real domain. Branch-preview hosts (claude-*--humansareinferior.netlify.app) are
# not matched, so previews still work. (Cleaner long-term fix: set the Supabase
# Auth Site URL to https://humansareinferior.com.)
[[redirects]]
  from = "https://humansareinferior.netlify.app/*"
  to = "https://humansareinferior.com/:splat"
  status = 301
  force = true

# SPA: serve index.html for client-side (hash) routes and unknown paths.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
